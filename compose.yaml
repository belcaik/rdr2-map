name: ${COMPOSE_PROJECT_NAME:-rdr2-map}

services:
  map:
    image: ${MAP_IMAGE:-ghcr.io/belcaik/rdr2-map:latest}
    init: true
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3001
      DATA_ROOT: /data
      DB_PATH: /data/rdr2.db
      TILES_DIR: /data/tiles
      STATIC_ROOT: /app/frontend/dist
    ports:
      - "${BIND_HOST:-0.0.0.0}:${HTTP_PORT:-8081}:3001"
    volumes:
      - "${SERVER_DATA_DIR:-./data}:/data"
    healthcheck:
      test: >-
        node -e "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
